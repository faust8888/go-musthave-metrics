edition = "2023";

option features.field_presence = IMPLICIT;

package metrics;

option go_package = "github.com/faust8888/go-musthave-metrics/internal/proto;proto";

// Metric defines a single metric.
message Metric {
  string id = 1;

  enum MType {
    GAUGE = 0;
    COUNTER = 1;
  }

  MType type = 2;
  int64 delta = 3;
  double value = 4;
}

// UpdateMetricsRequest contains metrics to update.
message UpdateMetricsRequest {
  repeated Metric metrics = 1;
}

// UpdateMetricsResponse acknowledges a successful update.
message UpdateMetricsResponse {}

// MetricsService provides metric updates.
service Metrics {
  rpc UpdateMetrics(UpdateMetricsRequest) returns (UpdateMetricsResponse);
}
